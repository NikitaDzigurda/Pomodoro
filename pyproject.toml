[project]
name = "pomodoro-poetry"
version = "0.1.0"
description = ""
authors = [
    {name = "NikitaDzigurda",email = "timofeev.matvey0107@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.8,<0.116.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "pydantic-settings (>=2.8.0,<3.0.0)",
    "sqlalchemy (>=2.0.38,<3.0.0)",
    "alembic (>=1.15.1,<2.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "redis (>=5.2.1,<6.0.0)",
    "response (>=0.5.0,<0.6.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "greenlet (>=3.2.0,<4.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "pytest-twisted (>=1.14.3,<2.0.0)",
    "twisted (>=24.11.0,<25.0.0)",
    "pytest-factoryboy (>=2.7.0,<3.0.0)",
    "pytest-asyncio (>=0.26.0,<0.27.0)",
    "celery (>=5.5.2,<6.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.20,<1.0.0)",
    "flower (>=2.0.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "pomodoro_poetry", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest-factoryboy = "^2.7.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
